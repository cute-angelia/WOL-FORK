name: Build and publish a Docker image to ghcr.io

on:
  # publish on releases, e.g. v2.1.13 (image tagged as "2.1.13" - "v" prefix is removed)
  release:
    types: [published]

  # publish on version tags
  push:
    tags:
      - 'v*' # matches v1.0, v20.15.10

env:
  REPOSITORY: "${{ github.repository }}"
  MM_NOTIFY_URL: "${{ secrets.MM_NOTIFY_URL }}"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build and publish Docker image for ${{ github.repository }}
        uses: macbre/push-to-ghcr@v14
        with:
          image_name: ${{ github.repository }} # it will be lowercased internally
          github_token: ${{ secrets.RELEASE_TOKEN }}

      - name: Notify
        if: always()
        run: |
          if [ -n "$MM_NOTIFY_URL" ]; then
            STATUS="${{ job.status }}"
            curl -s -H 'Content-Type: application/json' \
              -d "{\"msgtype\": \"text\", \"text\": {\"content\": \"镜像发布${STATUS} $REPOSITORY\"}}" \
              "$MM_NOTIFY_URL"
          else
            echo 'MM_NOTIFY_URL not set, skipping notification'
          fi